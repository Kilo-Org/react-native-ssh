name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  rust-integration:
    name: Rust integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build the SSH test server
        run: docker build -t ssh-core-test -f ssh-core/tests/docker/Dockerfile ssh-core/tests

      - name: Start the SSH test servers
        run: |
          docker run -d --name ssh-core-password -p 2222:2222 ssh-core-test password
          docker run -d --name ssh-core-twofactor -p 2223:2222 ssh-core-test two-factor
          docker run -d --name ssh-core-silent -p 2224:2222 ssh-core-test silent
          for port in 2222 2223 2224; do
            for attempt in $(seq 1 30); do
              if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then break; fi
              sleep 1
            done
          done

      - name: Run the integration suite
        env:
          SSH_TEST_HOST: 127.0.0.1
        run: cargo test --test integration

      - name: Show the server logs on failure
        if: failure()
        run: |
          for name in ssh-core-password ssh-core-twofactor ssh-core-silent; do
            echo "== $name"
            docker logs "$name" || true
          done

      - name: Stop the SSH test servers
        if: always()
        run: docker rm -f ssh-core-password ssh-core-twofactor ssh-core-silent


  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and platform tools
        run: sdkmanager --install "platform-tools" "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core and Kotlin bindings
        run: scripts/build-android.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install module dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm install --no-audit --no-fund

      - name: Prebuild the example app
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      - name: Assemble the example app
        working-directory: example/android
        run: ./gradlew assembleDebug

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust core and the xcframework
        run: scripts/build-ios.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install module dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm install --no-audit --no-fund

      - name: Prebuild the example app
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: example/ios
        run: pod install

      - name: Build the example app for the simulator
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace ReactNativeSshExample.xcworkspace \
            -scheme ReactNativeSshExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
