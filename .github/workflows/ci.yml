name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run format:check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  rust-integration:
    name: Rust integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build the SSH test server
        run: docker build -t ssh-core-test -f ssh-core/tests/docker/Dockerfile ssh-core/tests

      # One network for the whole fixture: the bastion reaches the target only
      # over it, and `ssh-core-http` has no published port at all. Port 9000 is
      # published so a remote forward bound inside the container is reachable.
      - name: Start the SSH test servers
        run: |
          set -euo pipefail
          docker network create ssh-core-net
          docker run -d --name ssh-core-password --network ssh-core-net -p 2222:2222 -p 9000:9000 ssh-core-test password
          docker run -d --name ssh-core-twofactor --network ssh-core-net -p 2223:2222 ssh-core-test two-factor
          docker run -d --name ssh-core-silent --network ssh-core-net -p 2224:2222 ssh-core-test silent
          docker run -d --name ssh-core-http --network ssh-core-net ssh-core-test http
          docker run -d --name ssh-core-bastion --network ssh-core-net -p 2226:2222 ssh-core-test password
          docker run -d --name ssh-core-target --network ssh-core-net ssh-core-test password
          for port in 2222 2223 2224 2226; do
            for attempt in $(seq 1 30); do
              if (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then break; fi
              sleep 1
            done
          done

      - name: Run the integration suite
        env:
          SSH_TEST_HOST: 127.0.0.1
          SSH_TEST_REMOTE_FORWARD_PORT: '9000'
          SSH_TEST_HTTP_HOST: ssh-core-http
          SSH_TEST_HTTP_PORT: '8080'
          SSH_TEST_BASTION_PORT: '2226'
          SSH_TEST_TARGET_HOST: ssh-core-target
          SSH_TEST_TARGET_PORT: '2222'
          SSH_TEST_THIRD_HOP_HOST: ssh-core-password
          SSH_TEST_THIRD_HOP_PORT: '2222'
        run: cargo test --test integration --test transfers

      - name: Show the server logs on failure
        if: failure()
        run: |
          for name in ssh-core-password ssh-core-twofactor ssh-core-silent ssh-core-http ssh-core-bastion ssh-core-target; do
            echo "== $name"
            docker logs "$name" || true
          done

      - name: Stop the SSH test servers
        if: always()
        run: |
          docker rm -f ssh-core-password ssh-core-twofactor ssh-core-silent ssh-core-http ssh-core-bastion ssh-core-target
          docker network rm ssh-core-net

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK; only add the packages
      # this project resolves (Expo SDK 58: compileSdk 37, build-tools 37,
      # NDK 27.1.12297006). android-actions/setup-android installs a `tools`
      # package that no longer exists in the SDK repository.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(ls -d "$sdk_root"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.1.12297006"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core and Kotlin bindings
        run: scripts/build-android.sh

      - name: Verify the native artifacts
        run: |
          set -euo pipefail
          test -f android/src/main/jniLibs/arm64-v8a/libssh_core.so
          test -f android/src/main/jniLibs/x86_64/libssh_core.so
          test -f android/src/main/java/ai/kilo/reactnativessh/uniffi/ssh_core.kt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install module dependencies
        run: npm ci

      - name: Build the module
        run: npm run build

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Prebuild the example app
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      - name: Assemble the example app
        working-directory: example/android
        run: ./gradlew assembleDebug

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust core and the xcframework
        run: scripts/build-ios.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install module dependencies
        run: npm ci

      - name: Build the module
        run: npm run build

      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Prebuild the example app
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: example/ios
        run: pod install

      # Guards the vendored xcframework: an exclude_files pattern that matches
      # Frameworks/ makes CocoaPods drop the bundle, after which the app link
      # fails on the uniffi symbols instead of here.
      - name: Verify the xcframework is vendored
        working-directory: example/ios
        run: |
          set -euo pipefail
          support="Pods/Target Support Files/ReactNativeSsh"
          test -f "$support/ReactNativeSsh-xcframeworks.sh"
          grep -q 'ios-arm64_x86_64-simulator' "$support/ReactNativeSsh-xcframeworks.sh"
          grep -q -- '-l"ssh_core"' "Pods/Target Support Files/"Pods-*/Pods-*.debug.xcconfig

      - name: Build the example app for the simulator
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace ReactNativeSshExample.xcworkspace \
            -scheme ReactNativeSshExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      - name: Upload the simulator app
        uses: actions/upload-artifact@v4
        with:
          name: example-ios-simulator-app
          path: example/ios/build/Build/Products/Debug-iphonesimulator/ReactNativeSshExample.app
          retention-days: 7
