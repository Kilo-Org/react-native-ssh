name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and platform tools
        run: sdkmanager --install "platform-tools" "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core and Kotlin bindings
        run: scripts/build-android.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install module dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm install --no-audit --no-fund

      - name: Prebuild the example app
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      - name: Assemble the example app
        working-directory: example/android
        run: ./gradlew assembleDebug

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust core and the xcframework
        run: scripts/build-ios.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install module dependencies
        run: npm ci

      - name: Install example dependencies
        working-directory: example
        run: npm install --no-audit --no-fund

      - name: Prebuild the example app
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: example/ios
        run: pod install

      - name: Build the example app for the simulator
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace ReactNativeSshExample.xcworkspace \
            -scheme ReactNativeSshExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
