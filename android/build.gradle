plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.kilo.reactnativessh'
version = '0.0.0'

android {
  namespace "ai.kilo.reactnativessh"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The uniffi Kotlin bindings call into libssh_core.so through JNA direct mapping.
  implementation 'net.java.dev.jna:jna:5.17.0@aar'
  implementation 'androidx.annotation:annotation:1.9.0'
  implementation 'com.facebook.react:react-android'
}
